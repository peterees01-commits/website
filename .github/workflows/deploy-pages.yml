name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/frontend-design-skills-jar617]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p _site
          shopt -s extglob dotglob
          cp -r !(.git|.github|.claude|_site|CLAUDE.md) _site/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate SEO pages
        run: node scripts/generate-seo-pages.js _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # deploy-pages occasionally can't find the artifact it was just
      # given (GitHub's artifact API lagging behind the upload) — this
      # job finishes in well under a minute with nothing else to fill
      # that gap, so give the artifact a moment to become queryable.
      - name: Wait for artifact to become queryable
        run: sleep 15

      - id: deployment
        uses: actions/deploy-pages@v4
